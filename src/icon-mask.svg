<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Archie">
  <!--
  Control-panel nav icon. Craft paints this as a flat silhouette in currentColor, so it is drawn as
  one bold mass with a single knockout for the eye, scaled to fill the box.

  The full line work is deliberately not here. At the ~16px the nav actually renders, the crosshatch
  and the ear are below one pixel and turn the whole head to mud; the outer contour already carries
  the brow, the nose and the mouth, because each of those cuts in from the edge rather than floating
  inside. Be aware this is still a filled head — it reads as a profile from about 24px, and as a
  dark lump below that. That is the artwork, not the tracing.
  -->
